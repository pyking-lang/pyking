# The cases with arguments. `arguments` is passed to the program
# itself -- after `--` for the interpreter, and the host's own way for
# each compiled target -- and it is the only way a run's arguments can
# be written down, since a program cannot ask for its own.

[[cases]]
file = "lib_sys_arguments_passed.pyk"
libs = ["sys"]
arguments = ["alpha", "beta gamma"]
excluded = { web = "a browser page has no command-line arguments", iweb = "a browser page has no command-line arguments", c = "lists need a heap, and C has no garbage collector to free one" }

