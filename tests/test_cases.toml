# Two libraries at once. `sys` is named before `fs` on purpose: it puts
# a module `Sys` on the OCaml include path before fs.ml is compiled,
# which is what an external implementation using an unqualified
# `Sys.file_exists` would break on.

[[cases]]
file = "lib_two_libraries.pyk"
libs = ["sys", "fs"]
targets = ["python14", "node24", "ocaml5.5", "interpret"]

# The io library: standard output beside `print`, and standard input.
