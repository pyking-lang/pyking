# Which targets each test program is expected to work with.
#
# Every program must work with `python`, the reference backend. The
# JavaScript, C and Java backends support a subset of Pyking so far (see
# docs/architecture.md), so a program using lists, `for`, `match` or
# comprehensions is python-only until they grow; tuples work on the
# JavaScript and OCaml targets but not the C or Java ones. Targets that share a
# backend always agree: `nodejs`, `esm` and `html` differ only in
# packaging, `c89`/`c23` only in how the same C is printed, and
# `java8`/`java17`/`java21` only in how the same Java is printed -- so a
# program supported by one of a group is supported by all of it.
#
# Two of the names here compile nothing. `typecheck` checks a program and
# compares the printed AST against its `.ast.out`; `interpret` runs it
# with src/interpreter.py and compares its output against the same `.out`
# every compiling target is compared against. The interpreter runs
# exactly the fragment the type checker accepts, so a program with `var`,
# `for`, `while`, `match`, lists or an unannotated `def` does not list
# it.
#
# tests/test_script.py reads this file, runs each program on each of its
# targets, and compares the output against the sibling `.out` file.

[[cases]]
file = "arithmetic.pyk"
targets = ["python", "nodejs", "esm", "html", "c89", "c23", "java8", "java17", "java21", "interpret"]

