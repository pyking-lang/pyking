# The standard library under lib/. A `libs` entry is a library module,
# not a file in tests/: the compiler finds it on its own search path and
# writes it beside the program's output, and the targets that link a
# program are given it in this order. Libraries come before a program's
# own `modules`, since a library never imports one of those.
#
# `fs` is the one library whose whole boundary is scalar -- a String and
# a Bool cross on every target. It excludes web/iweb: a browser has
# no filesystem, so its browser implementation only says so on the
# console, and there is no output to compare.

[[cases]]
file = "lib_fs_roundtrip.pyk"
libs = ["fs"]
excluded = { web = "a browser page has no file system", iweb = "a browser page has no file system" }

[[cases]]
file = "lib_fs_exists.pyk"
libs = ["fs"]
excluded = { web = "a browser page has no file system", iweb = "a browser page has no file system" }

# `sys` builds lists, which C has no garbage collector for, so `sys.args`
# and `sys.env` do not reach C -- `sys.exit` does, below. `time` builds
# a tuple, which every target carries. See docs/libraries.md.

[[cases]]
file = "lib_sys_arguments.pyk"
libs = ["sys"]
excluded = { web = "a browser page has no command-line arguments", iweb = "a browser page has no command-line arguments", c = "lists need a heap, and C has no garbage collector to free one" }

[[cases]]
file = "lib_sys_environment.pyk"
libs = ["sys"]
excluded = { web = "a browser page has no environment variables", iweb = "a browser page has no environment variables", c = "lists need a heap, and C has no garbage collector to free one" }

[[cases]]
file = "lib_time_format.pyk"
libs = ["time"]

[[cases]]
file = "lib_time_now.pyk"
libs = ["time"]

[[cases]]
file = "lib_math_basic.pyk"
libs = ["math"]

[[cases]]
file = "lib_math_approx.pyk"
libs = ["math"]

[[cases]]
file = "lib_math_from.pyk"
libs = ["math"]

# Two regression cases for collisions between a Pyking module's name, or
# an exported name, and something the host has already taken. Both are
