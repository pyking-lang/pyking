# The standard library under lib/. A `libs` entry is a library module,
# not a file in tests/: the compiler finds it on its own search path and
# writes it beside the program's output, and the targets that link a
# program are given it in this order. Libraries come before a program's
# own `modules`, since a library never imports one of those.
#
# `fs` is the one library whose whole boundary is scalar -- a String and
# a Bool cross on every target. It excludes web/iweb: a browser has
# no filesystem, so its browser implementation only says so on the
# console, and there is no output to compare.

[[cases]]
file = "lib_fs_roundtrip.pyk"
libs = ["fs"]
excluded = { web = "a browser page has no file system", iweb = "a browser page has no file system" }

[[cases]]
file = "lib_fs_exists.pyk"
libs = ["fs"]
excluded = { web = "a browser page has no file system", iweb = "a browser page has no file system" }

# `sys` builds lists, which C does not compile yet, so `sys.args`
