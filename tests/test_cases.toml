# Which targets each test program runs on, and why any it does not.
#
# A case runs on every target -- python12, python14, node22, node24,
# web2020, web2024, iweb2020, iweb2024, c89, c99, c23, java8, java17,
# java21, ocaml4.14, ocaml5.5 and interpret -- and on
# `pyking` too where it is a `typecheck_*` program. The one way to leave
# a target out is `excluded`, a table from a target or a family (`c`,
# `java`, `web`, ...) to the reason, which tests/test_script.py prints in
# its summary. A `fail_typecheck_*` program, written to be refused, runs
# on `pyking` alone. `also` adds the targets that turn a pass off
# (`python12_notail`, `pyking_notail`, `pyking_nosugar`), and
# `pyking_rerun`, which runs what `pyking` printed and compares its output
# against the `.out`.
#
# Two of the names run nothing. `pyking` compiles a program to Pyking and
# compares the printed AST against its `.ast.out`; `interpret` runs it
# with src/interpreter.ml and compares its output against the same `.out`
# every compiling target is compared against.
#
# tests/test_script.py reads this file, runs each program on each of its
# targets, and compares the output against the sibling `.out` file.

